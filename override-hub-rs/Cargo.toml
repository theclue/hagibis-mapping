[package]
name = "hagibis_hub_mapper"
version = "0.1.0"
edition = "2024"
authors = ["Gabriele Baldassarre <gabriele@gabrielebaldassarre.com>"]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ctrlc = "3"
